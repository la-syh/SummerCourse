<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ key }} - RUC Search</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    >
  </head>

  <body>
    <header class="results-header">
      <div class="header-content">
        <a class="header-logo" href="{{ url_for('index') }}">
          RUC Search
        </a>

        <form
          class="search-form"
          action="{{ url_for('query') }}"
          method="get"
        >
          <input
            class="search-input"
            type="search"
            name="key"
            value="{{ key or '' }}"
            placeholder="输入要查询的关键词"
            required
          >
          <button class="search-button" type="submit">
            搜索
          </button>
        </form>
      </div>
    </header>

    <main class="results-container">
      <p class="result-summary">
        “{{ key }}”共找到 {{ results | length }} 条结果
      </p>

      {% if results %}
        {% for res in results %}
          <article class="result-card">
            <a
              class="result-title"
              href="{{ res['url'] }}"
              target="_blank"
              rel="noopener noreferrer"
            >
              {{ res['title'] }}
            </a>

            <p class="result-url">{{ res['url'] }}</p>
            <p class="result-abstract">
              {{ res['abstract'] }}
            </p>
          </article>
        {% endfor %}
      {% else %}
        <section class="empty-state">
          <h2>没有找到相关结果</h2>
          <p>请尝试更换关键词或缩短查询内容。</p>
        </section>
      {% endif %}
    </main>
  </body>
</html>
